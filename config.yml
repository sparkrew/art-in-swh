#==================#
# Projects Configs #
#==================#

chosen_config:
    config_mode: 'examples' # the idea is that we'll be able to reuse this code afterwards
    model: 'qwen'
    prompt_version: 'PROMPT_1'  # 'PROMPT_1' or 'PROMPT_2' for now

# LLM
qwen:
  model_name: "qwen3-coder-30b-fp8"
  max_tokens: 124
  temperature: 0.1
  system_prompt: "You are a helpful coding assistant."
  base_url: "http://localhost:8000/v1"


# Examples paths
examples:
  src_path: "../links/projects/def-baudry/shared/data/examples/src"
  true_labels_path: "../links/projects/def-baudry/shared/data/examples/true_labels"
  predicted_labels_path: "../links/projects/def-baudry/shared/data/examples/predicted_labels"
  # Evaluation
  report_folder_path: "../links/projects/def-baudry/shared/data/examples/reports"

